# 本地開發專用配置
#
# 用法：npx wrangler dev --config wrangler.dev.toml
#
# 與 wrangler.toml 的差異：
#   - 內聯了一個 KV 名稱空間假 ID，讓 miniflare 模擬 KV 時不再報"未繫結"
#   - 不動主 wrangler.toml，避免與 npm run setup 自動寫入的 KV 塊衝突
name = "subscription-manager-dev"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 本地用的佔位 KV，miniflare 會自動用 .wrangler/state 下的本地 KV 檔案
[[kv_namespaces]]
binding = "SUBSCRIPTIONS_KV"
id = "local-dev-kv-placeholder"
preview_id = "local-dev-kv-preview"

[assets]
directory = "./public"
binding = "ASSETS"

[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "development"
